project:
  type: book
  output-dir: docs

book:
  title: "Learning python"
  author: "Colton Gearhart"
  date: "08/12/2026"
  cover-image: learning-python.png
  chapters:
    - index.qmd
    - projects.qmd

jupyter: python3
        
format:
  html:
    theme: flatly
    code-link: true
    #code-fold: show
    code-tools: true
    number-depth: 2
    toc-depth: 3
    code-block-border-left: "#2C3E50"
    highlight-style: github
    grid:
      sidebar-width: 200px
      body-width: 1200px
      margin-width: 200px
      gutter-width: 1rem

title-block-banner: true
